<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="/css/general.css">
</head>
<body>
    <h1>Заполните форму</h1>
    <div class="form_container">
        <form id=login action="/regform" method="POST">
            <div class="form_element">
                <label for="username">Учётная запись:</label>
                <br/>
                <input type="text" name="username" id="username" placeholder="Учётная запись"/>
            </div>
            <div class="form_element">
                <label for="firstname">Имя пользователя:</label>
                <br/>
                <input type="text" name="firstname" id="firstname" placeholder="Имя"/>
            </div>
            <div class="form_element">
                <label for="lastname">Фамилия пользователя:</label>
                <br/>
                <input type="text" name="lastname" id="lastname" placeholder="Фамилия"/>
            </div>
            <div class="form_element">
                <label for="password">Пароль:</label>
                <br/>
                <input type="password" name="password" id="password" placeholder="Пароль"/>
            </div>
            <br/>
            <div class="form_element">
                <label for="password">Пароль (повторить):</label>
                <br/>
                <input type="password" id="password2" placeholder="Пароль"/>
            </div>
            <input type="submit" value="Зарегистрироваться">
        </form>
    </div>

</body>
</html>
